# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: true

tone_instructions: >-
  This service owns no plan data. Everything a member sees is derived from a
  contract published by another repository. Review changes here with that
  dependency in mind: say what upstream shape the code now assumes, and what
  happens at run time when the upstream stops matching it.

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  estimate_code_review_effort: true
  poem: false

  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "src/enrollment_api/models/**"
      instructions: |
        This is a hand-maintained copy of another service's response contract.
        It does not fail at build time when the upstream changes. For any change
        here, state which upstream field it now requires, tolerates or ignores,
        and what a member's request does when the upstream sends something else.

    - path: "src/enrollment_api/quoting.py"
      instructions: |
        Pricing reads a rate table published by another repository. Pay
        attention to defaulting: a lookup that substitutes a value for a missing
        key turns an upstream data gap into a wrong premium on a member's
        screen, with no exception and no failing test. When a default is added,
        changed or removed, say what the member sees.

    - path: "src/enrollment_api/billing.py"
      instructions: |
        The payroll deduction codes are keyed by rate table identifiers that are
        published upstream. Any change to this map, or to any upstream
        identifier it references, decides whether the payroll deduction file is
        accepted or rejected in full. Treat a missing entry as a production
        incident, not a validation gap.

    - path: "db/**"
      instructions: |
        Enrolment rows are the record of what a member was sold. Denormalised
        columns here are deliberate. When one changes, say whether existing rows
        remain a faithful record and what reads them downstream.

  pre_merge_checks:
    docstrings:
      mode: off

    title:
      mode: warning

    description:
      mode: warning

    issue_assessment:
      mode: error

    custom_checks:
      - name: Upstream contract assumptions are stated
        mode: warning
        instructions: |
          This check applies when the diff touches
          `src/enrollment_api/models/`, `src/enrollment_api/clients/`,
          `src/enrollment_api/quoting.py` or `src/enrollment_api/billing.py`.

          PASS if the change states which fields or identifiers it assumes the
          plan catalog publishes, and what this service does at run time when
          that assumption stops holding.

          FAIL if a new upstream field, identifier or shape is depended on with
          no statement of the failure mode, naming the specific assumption.

knowledge_base:
  opt_out: false
  learnings:
    scope: local
  issues:
    scope: auto
  pull_requests:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
  linked_repositories:
    - repository: "davidshinn-cr/northwind-plan-config"
      instructions: >-
        The upstream plan catalog. It publishes benefit plans as JSON under
        config/plans/ and rate tables under config/rates/, and serves them from
        GET /plans and GET /rate-tables/{rate_table_id}. This service mirrors
        that response contract by hand and keys payroll deduction codes on the
        rate table identifiers published there. Treat any change to a plan's
        availability, to a published contract field, or to a rate table
        identifier in that repository as potentially breaking for this service.
